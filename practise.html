<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <title>Practise Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5;
        }

        h1 {
            margin-top: 40px;
        }

        .animals {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
        }

        .animal {
            background-color: white;
            padding: 20px;
            border-radius: 15px;
        }

        .animal img {
            width: 500px;
            height: 500px;
            object-fit: cover;
            border-radius: 10px;
        }

        .animal h2 {
            margin-bottom: 0;
        }
    </style>
</head>

<body>

    <h1>Practise Website</h1>

    <div class="animals">

        <div class="animal">
            <img src="dog.jpg" alt="dog">
            <h2>Dog</h2>
        </div>

        <div class="animal">
            <img src="cat.jpg" alt="cat">
            <h2>Cat</h2>
        </div>

    </div>

</body>

</html>
